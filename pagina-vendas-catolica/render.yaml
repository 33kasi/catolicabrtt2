services:
  - type: web
    name: devocao-mariana
    env: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: SIGILOPAY_CLIENT_ID
        sync: false
      - key: SIGILOPAY_CLIENT_SECRET
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
